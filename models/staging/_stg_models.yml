models:
    - name: stg_ecommerce__customers
      description: "Staging model for customers data"
      columns:
        - name: customer_id
          description: "Unique identifier for each customer"
          data_tests:
            - unique
            - not_null
        - name: customer_unique_id
          description: "Unique identifier for each customer across all systems"
          data_tests:
            - not_null
            
    - name: stg_ecommerce__orders
      description: "Staging model for orders data"
      columns:
        - name: order_id
          description: "Unique identifier for each order"
          data_tests:
            - unique
            - not_null
        - name: order_status
          description: "Status of the order (e.g., pending, completed, canceled)"
          data_tests:
          - accepted_values:
              arguments:
                  values: ['delivered', 'invoiced', 'shipped', 'processing', 'unavailable', 'canceled', 'created', 'approved']
            
    - name: stg_ecommerce__order_items
      description: "Staging model for order items data"
      columns:
        - name: order_item_id
          description: "Unique identifier for each order item"
          data_tests:
            - not_null
        - name: order_id
          description: "Identifier for the order associated with the order item"
          data_tests:
            - not_null
            - relationships:
                arguments:
                  to: ref('stg_ecommerce__orders')
                  field: order_id
        - name: product_id
          description: "Identifier for the product associated with the order item"
          data_tests:
            - not_null
            - relationships:
                arguments:
                  to: ref('stg_ecommerce__products')
                  field: product_id
        - name: seller_id
          description: "Identifier for the seller associated with the order item"
          data_tests:
            - not_null
            - relationships:
                arguments:
                  to: ref('stg_ecommerce__sellers')
                  field: seller_id

    - name: stg_ecommerce__products
      description: "Staging model for products data"
      columns:
        - name: product_id
          description: "Unique identifier for each product"
          data_tests:
            - unique
            - not_null

    - name: stg_ecommerce__sellers
      description: "Staging model for sellers data"
      columns:
        - name: seller_id
          description: "Unique identifier for each seller"
          data_tests:
            - unique
            - not_null